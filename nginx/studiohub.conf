# Nginx do HOST (VPS Hostinger) — proxy reverso para os contentores Docker.
# Instalar em /etc/nginx/sites-available/studiohub.conf e ativar com:
#   ln -s /etc/nginx/sites-available/studiohub.conf /etc/nginx/sites-enabled/
#
# Substituir app.oteudominio.pt pelo domínio real antes de usar.
# Depois de correr `certbot --nginx`, este ficheiro é atualizado automaticamente
# com os blocos "listen 443 ssl" e o redirecionamento 80 -> 443.

server {
    listen 80;
    server_name app.oteudominio.pt;

    # Uploads de fotos vão como JSON/base64 no corpo do pedido — podem ser
    # vários MB por imagem. Sem isto, o Nginx devolve 413 Request Entity Too Large.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://127.0.0.1:8001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
