services:
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # A ligação ao MongoDB Atlas vem EXCLUSIVAMENTE da variável MONGO_URL
    # definida em ./backend/.env (ficheiro que existe só na VPS, nunca no Git).
    env_file:
      - ./backend/.env
    ports:
      - "127.0.0.1:8001:8001"

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend
